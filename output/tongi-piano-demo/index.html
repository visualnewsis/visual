<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0d1719"><title>통이 × 피아노 · 동작 샘플</title><link rel="stylesheet" href="sample.css?v=5"><script defer src="sample.js?v=5"></script></head>
<body>
 <header class="sample-tools"><div class="sample-brand"><b>통이 × 피아노</b><span>샘플 전용 · 실제 사이트 미적용</span></div><div class="sample-controls"><button id="auto" type="button" aria-pressed="true">많이 등장 ON</button><button id="next-cue" type="button">다음 동작 ▷</button><label for="scene">장면</label><select id="scene" aria-label="통이 장면 선택"></select><button id="reset" type="button">처음부터</button></div></header>
 <main class="sample-layout"><div class="piano-viewport"><iframe id="piano" title="굳이구지 피아노 체험 샘플" src="piano.html" allow="fullscreen" allowfullscreen></iframe></div><aside class="tongi-stage" aria-label="통이 시연 무대"><div class="stage-top"><span class="stage-kicker">아는 AI, 통이</span><span id="counter">등장 0회</span></div><div id="home" class="home"><span id="away" hidden>통이가 옆으로 놀러 갔어요 ↖</span><i></i></div><div class="speech"><small id="cue-name">함께 연주해요</small><p id="talk">나 여기 있어요!<br>건반을 눌러볼까요?</p></div><p class="stage-note">연주하거나 아래로 내려보세요.<br>여러 조작 지점에서 통이가 반응해요.</p><p class="stage-credit">크리에이티브 디렉터 = 안재현</p></aside></main>
 <div id="actor" data-pose="normal" data-motion="pop" data-placement="home" aria-hidden="true"><div class="sprite"></div><span class="spark s1">✦</span><span class="spark s2">✧</span></div>
 <p class="sr-only" id="live" role="status" aria-live="polite"></p>
</body></html>
