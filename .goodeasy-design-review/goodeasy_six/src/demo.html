<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOODEASY 조작 프로토타입</title><link rel="stylesheet" href="tokens.css"><main id="experience"><header><small>VISUAL NEWSIS / 굳이구지</small><h1 id="title">낚시 릴</h1><p id="instruction">손잡이를 돌려 줄을 감아보세요.</p></header><div class="model-view" id="view" role="img" aria-label="기구 모델 연결 전 표시 영역"><p style="padding:20px">3D 모델 연결 전 — 이 페이지는 상태 전이 테스트 전용입니다.</p><p id="status" style="padding:20px" aria-live="polite">대기</p></div><footer><div class="control-row"><button id="primary">감기</button><button id="observe" disabled>방금 행동 관찰</button><button id="return" class="secondary">첫 체험</button></div><p><small>크리에이티브 디렉터 = 안재현</small></p></footer></main><script type="module">import{createSession,commitAction,enterObservation,returnToExperience}from './interaction-core.js';const s=createSession('fishing-reel');let turns=0;const $=id=>document.getElementById(id);function render(){ $('observe').disabled=!s.lastAction;$('status').textContent=s.phase+' / '+turns.toFixed(1)+'회';}function wind(){turns+=.25;commitAction(s,'wind',{handleTurns:turns,dragSetting:.4,lineTension:.3});render();}$('primary').onclick=wind;$('observe').onclick=()=>{enterObservation(s);render()};$('return').onclick=()=>{returnToExperience(s);render()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&!e.repeat&&e.target.tagName!=='INPUT'){e.preventDefault();wind();}});render();</script></html>
