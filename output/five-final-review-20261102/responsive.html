<!doctype html><meta charset="utf-8"><title>Five episode responsive QA</title><style>body{margin:0;background:#202423;color:white;font:14px Arial}header{padding:12px;position:sticky;top:0;z-index:2;background:#202423}button,select{padding:8px;margin:3px}iframe{display:block;border:0;background:#101815;margin:auto;height:844px}main{overflow:auto}</style><header><label>편 <select id="episode"><option>violin</option><option>espresso-machine</option><option>gramophone</option><option>keyboard</option><option>projector</option></select></label><button data-size="390">390 mobile</button><button data-size="768">768 tablet</button><button data-size="1200">1200 desktop</button><button id="hero">Hero</button><button id="anatomy">Anatomy</button><button id="top">화면 맨 위</button><button id="modeltop">관찰 화면 상단</button><span id="size">1200 px</span></header><main><iframe id="page" title="실제 서비스 반응형 검수" width="1200"></iframe></main><script>const p=document.getElementById('page'),e=document.getElementById('episode');document.getElementById('modeltop').onclick=()=>{window.scrollTo(0,0);const t=p.contentDocument.getElementById('anatomy');if(t)p.contentWindow.scrollTo(0,t.getBoundingClientRect().top+p.contentWindow.scrollY-65);};document.getElementById('top').onclick=()=>{window.scrollTo(0,0);p.contentWindow.scrollTo(0,0);};function go(hash=''){p.src='/goodeasy/'+e.value+'/?deep=20261102-'+Date.now()+hash;}e.onchange=()=>go();document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{p.width=b.dataset.size;p.height=Number(b.dataset.size)>1000?'640':'844';p.style.height=p.height+'px';document.getElementById('size').textContent=b.dataset.size+' px';});document.getElementById('hero').onclick=()=>go();document.getElementById('anatomy').onclick=()=>go('#anatomy');const args=new URLSearchParams(location.search);e.value=args.get('episode')||'violin';go();</script>
