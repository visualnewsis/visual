<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>통이 × 피아노 · 불러서 도움받기</title><link rel="stylesheet" href="sample.css?v=12"><link rel="stylesheet" href="sprite.css?v=12"><script defer src="sample.js?v=12"></script></head><body>
<header class="sample-tools"><div><b>통이 × 피아노</b><small>호출형 샘플 · 실제 사이트 미적용</small></div><nav aria-label="샘플 미리보기"><select id="scene" aria-label="미리 볼 장면"></select><button id="preview">장면 보기</button><button id="restore">통이 도움</button><button id="reset">초기화</button></nav></header>
<main><iframe id="piano" title="굳이구지 피아노 체험 샘플" src="piano.html" allow="fullscreen" allowfullscreen></iframe></main>
<div id="idle-hint" hidden>어려울 땐 저를 불러주세요<button id="dismiss-intro" aria-label="첫 안내 닫기">×</button></div>
<button id="launcher" aria-label="통이에게 조작 도움 요청" aria-expanded="false" aria-controls="guide"><span class="idle-sprite" aria-hidden="true"></span><span>통이 도움</span></button>
<section id="guide" hidden role="region" aria-labelledby="guide-title" aria-describedby="talk"><div class="guide-heading"><b id="guide-title" tabindex="-1" aria-describedby="talk">통이가 도와줄게요</b><button id="close" aria-label="이번 안내 닫고 통이 돌려보내기">×</button></div><div class="guide-body"><div id="actor" data-pose="normal" data-motion="pop" aria-hidden="true"><div class="sprite"></div><span class="spark s1">✦</span><span class="spark s2">✧</span></div><p id="talk"></p></div><div class="guide-actions"><button id="next">다른 도움</button><button id="hide">통이 버튼 숨기기</button></div><small class="credit">크리에이티브 디렉터 = 안재현</small></section>
<p id="live" class="sr-only" role="status" aria-live="polite"></p></body></html>
