<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="robots" content="noindex"><title>아트 검수</title><style>body{margin:0;background:#202624}nav{position:fixed;top:12px;left:12px;z-index:2}button{padding:12px}</style><nav id="views"></nav><script type="module">
import * as T from '/arcade/bamta/vendor/three.module.min.js';
import {prepareArt} from '/arcade/bamta/art.js?v=20261025-mesh1';
import {buildScene} from '/arcade/bamta/scene.js?v=20261025-mesh1';
const art=await prepareArt(),scene=new T.Scene(),world=buildScene(scene,art),camera=new T.PerspectiveCamera(45,innerWidth/innerHeight,.05,100),renderer=new T.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;document.body.append(renderer.domElement);scene.add(new T.HemisphereLight('#fff3de','#69716a',2));const light=new T.DirectionalLight('#fff5e4',2);light.position.set(5,9,8);scene.add(light);world.boss.group.visible=true;world.doors.visible=false;
const views={여성동료:[[10.4,1.55,-2.6],[10.4,1.5,-4]],국장:[[22.5,1.58,-28.1],[22.5,1.5,-26.7]],복도동료:[[11.7,1.55,-11.1],[11.7,1.5,-12.5]],착석직원:[[-4.8,1.5,2.6],[-4.8,1,5]],호출버튼:[[24.78,1.35,-26.9],[24.78,1.32,-27.9]],화분:[[25.1,1.3,-19.4],[25.35,.9,-21.4]],컴퓨터:[[.2,1.55,6.1],[0,1.1,4.65]],복사기:[[5.75,1.5,-1.4],[5.75,.8,-3.3]]};
function show(name){const [p,t]=views[name];camera.position.set(...p);camera.lookAt(...t);renderer.render(scene,camera);document.title='아트 검수 · '+name;}
for(const name of Object.keys(views)){const b=document.createElement('button');b.textContent=name;b.onclick=()=>show(name);document.querySelector('nav').append(b);}show('국장');window.onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.render(scene,camera);};
</script></html>
