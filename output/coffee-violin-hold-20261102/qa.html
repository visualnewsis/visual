<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>굳이구지 재검수</title><style>body{margin:0;background:#0b1110;color:#e8e4d9;font:14px Arial,sans-serif}header{padding:18px 24px;border-bottom:1px solid #ffffff25}h1{font-size:20px;margin:0 0 10px}button,select,input{font:inherit}button,select{padding:10px 14px;background:#203b33;color:inherit;border:1px solid #72988b;border-radius:18px;margin:4px}main{max-width:1280px;margin:auto;padding:16px}canvas{display:block;width:100%;height:560px;background:#101916;touch-action:none}label{display:block;margin:12px 0}input{width:55%;vertical-align:middle}#read{color:#cbb78e} @media(max-width:600px){canvas{height:440px}main{padding:8px}button{padding:8px}}</style><header><h1>실제 3D 수정본 · 검수용</h1><select id="subject" aria-label="관찰할 모형"><option value="violin">바이올린</option><option value="puck">커피층 침투·추출</option><option value="ratio">분말과 액면</option></select><button id="all">전체</button><button id="side">옆판</button><button id="chin">턱받침·패드</button><button id="neck">목·지판</button></header><main><canvas id="stage" aria-label="수정한 실제 3D 모형"></canvas><div id="inspect"></div><label id="time-label" hidden>추출 진행 <input id="time" aria-label="추출 진행" type="range" min="0" max="16" step=".05" value="0"><output id="seconds">0.00초</output></label><button id="play" hidden>재생</button><p id="read">기기를 고르거나 부품을 가까이 보세요.</p></main><script type="module">
import {T,materials,makeStage} from '/goodeasy/assets/quality-kit.js?v=20261028-craft7';
import {buildViolin} from '/goodeasy/assets/quality-instruments.js?v=20261102-craft1';
import {configureViolinPresentation} from '/goodeasy/assets/models/violin-finish.js?v=20261102-craft1';
import {attachInspectControls} from '/goodeasy/assets/inspect-controls.js?v=20261029-release67';
import {buildCoffeeComparison,buildBrewRatio} from '/goodeasy/assets/coffee-detail.js?v=20261102-material1';
const $=id=>document.getElementById(id),stage=makeStage($('stage'));configureViolinPresentation(stage);let model,state,inspect,playing=false,last=0,frame=0;
function draw(){model.update?.(state,false,performance.now());stage.draw();$('seconds').textContent=Number(state.time||0).toFixed(2)+'초';}
function choose(){playing=false;$('play').textContent='재생';if(frame)cancelAnimationFrame(frame);frame=0;inspect?.dispose?.();document.querySelectorAll('.inspect-controls').forEach(x=>x.remove());const kind=$('subject').value;model=kind==='violin'?buildViolin(T,materials):kind==='puck'?buildCoffeeComparison():buildBrewRatio();state={...model.defaults,time:0,midi:69,bowing:false};model.update?.(state);stage.setModel(model,model.eye||[2,4,6]);inspect=attachInspectControls(stage,$('stage'),{label:'검수 모형'});$('time-label').hidden=$('play').hidden=kind!=='puck';for(const id of ['side','chin','neck'])$(id).disabled=kind!=='violin';draw();}
$('subject').addEventListener('change',choose);$('all').onclick=()=>inspect.reset();
function focus(part,factor){model.group.updateMatrixWorld(true);const b=new T.Box3().setFromObject(part),c=b.getCenter(new T.Vector3()),s=b.getSize(new T.Vector3()).length();inspect.focus(c,s*factor,{yaw:.4,pitch:.12});draw();}
$('side').onclick=()=>focus(model.parts.ribs,.9);$('chin').onclick=()=>focus(model.parts.chinrest,.8);$('neck').onclick=()=>focus(model.parts.neck,.65);
$('time').oninput=()=>{playing=false;$('play').textContent='재생';state.time=Number($('time').value);draw();};
function tick(now){frame=0;if(!playing)return;state.time=Math.min(16,state.time+(now-last)/1000);last=now;$('time').value=state.time;draw();if(state.time<16)frame=requestAnimationFrame(tick);else{playing=false;$('play').textContent='재생';}}
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'멈춤':'재생';if(playing){if(state.time>=16)state.time=0;last=performance.now();if(!frame)frame=requestAnimationFrame(tick);}};
choose();
</script></html>
