name: Update headline game

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/update_crossword.py"
      - ".github/workflows/update-headlines.yml"
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: headline-data-update
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow
      - name: Collect latest NEWSIS headlines
        run: python .github/scripts/update_headlines.py
      - name: Build latest NEWSIS crossword
        run: python .github/scripts/update_crossword.py
      - name: Collect latest NEWSIS staff photographs
        continue-on-error: true
        run: python .github/scripts/update_photo_puzzles.py
      - name: Build latest editshop recommendations
        run: python .github/scripts/update_editshop_recommendations.py
      - name: Commit changed question bank
        run: |
          if git diff --quiet -- arcade/output/data/headlines.json arcade/puzzle/data/puzzles.json arcade/puzzle/assets/photos arcade/words/data/crossword.json arcade/data/editshop-articles.json; then
            echo "No game data changes"
            exit 0
          fi
          git config user.name "visual-newsis-bot"
          git config user.email "visual-newsis-bot@users.noreply.github.com"
          git add arcade/output/data/headlines.json arcade/puzzle/data/puzzles.json arcade/puzzle/assets/photos arcade/words/data/crossword.json arcade/data/editshop-articles.json
          git commit -m "Refresh arcade news game data"
          git push origin HEAD:main
