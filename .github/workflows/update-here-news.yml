name: Update Here News data

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["interactive article by edit"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: here-news-collection
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      changed: ${{ steps.collect.outputs.changed }}
      servers: ${{ steps.servers.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          sparse-checkout: |
            newsmap
            .github/workflows
      - name: Collect and merge official NEWSIS sources
        id: collect
        run: python newsmap/tools/collect_news.py --previous-url https://visual.newsis.com/newsmap/data/articles.js
      - name: Validate candidate and collection regressions
        run: |
          python newsmap/tools/validate_snapshot.py newsmap/data/articles.js
          python newsmap/tests/locations.py
          python newsmap/tests/collector.py
          node newsmap/tests/rules.cjs
      - name: Read existing deployment destinations
        id: servers
        run: echo "matrix=$(jq -c . .github/workflows/deployment-config.json)" >> "$GITHUB_OUTPUT"
      - name: Prepare news data artifact
        if: steps.collect.outputs.changed == 'true'
        run: |
          mkdir -p here-news-data
          cp newsmap/data/articles.js here-news-data/articles.js
          cd here-news-data
          sha256sum articles.js > articles.sha256
      - uses: actions/upload-artifact@v6
        if: steps.collect.outputs.changed == 'true'
        with:
          name: here-news-data-${{ github.run_id }}
          path: here-news-data/
          retention-days: 2

  publish:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    runs-on: [self-hosted]
    timeout-minutes: 5
    strategy:
      max-parallel: 1
      matrix:
        server: ${{ fromJSON(needs.collect.outputs.servers) }}
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: here-news-data-${{ github.run_id }}
          path: here-news-data
      - name: Upload validated candidate to existing server staging
        uses: appleboy/scp-action@master
        with:
          host: ${{ matrix.server.ip }}
          username: ${{ matrix.server.username }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ matrix.server.port }}
          source: here-news-data/articles.js,here-news-data/articles.sha256
          target: ${{ matrix.server.gitDownFolder }}/here-news-data/${{ github.run_id }}
          strip_components: 1
      - name: Verify and atomically replace only news data
        id: install
        uses: appleboy/ssh-action@master
        with:
          host: ${{ matrix.server.ip }}
          username: ${{ matrix.server.username }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ matrix.server.port }}
          script: |
            set -eu
            cd "${{ matrix.server.gitDownFolder }}/here-news-data/${{ github.run_id }}"
            sha256sum -c articles.sha256
            python3 -c 'import json; from pathlib import Path; s=Path("articles.js").read_text(); p="window.NEWSMAP_ARTICLES="; assert s.startswith(p); d=json.loads(s[len(p):].strip().rstrip(";")); assert d["schemaVersion"]==1 and len(d["articles"])>=15'
            destination="${{ matrix.server.path }}/newsmap/data"
            test -d "$destination"
            if test -f "$destination/articles.js"; then
              cp "$destination/articles.js" "$destination/articles.previous.js.tmp"
              mv "$destination/articles.previous.js.tmp" "$destination/articles.previous.js"
            fi
            cp articles.js "$destination/articles.next.js"
            mv "$destination/articles.next.js" "$destination/articles.js"
            touch installed
      - name: Verify public data matches this artifact
        run: |
          python3 - <<'PY'
          import hashlib,time,urllib.request
          from pathlib import Path
          expected=hashlib.sha256(Path('here-news-data/articles.js').read_bytes()).hexdigest()
          for attempt in range(3):
              request=urllib.request.Request('https://visual.newsis.com/newsmap/data/articles.js?verify='+str(time.time_ns()),headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(request,timeout=25) as response:
                  actual=hashlib.sha256(response.read()).hexdigest()
              if actual==expected:
                  print('PASS: public news data hash matches the validated candidate')
                  break
              if attempt==2:
                  raise SystemExit('Public data differs from the uploaded candidate')
              time.sleep(3)
          PY
      - name: Restore previous news data if public verification failed
        if: failure() && steps.install.outcome == 'success'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ matrix.server.ip }}
          username: ${{ matrix.server.username }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ matrix.server.port }}
          script: |
            set -eu
            destination="${{ matrix.server.path }}/newsmap/data"
            if test -f "$destination/articles.previous.js"; then
              cp "$destination/articles.previous.js" "$destination/articles.next.js"
              mv "$destination/articles.next.js" "$destination/articles.js"
            fi
      - name: Remove this successful run's staging files
        if: success()
        uses: appleboy/ssh-action@master
        with:
          host: ${{ matrix.server.ip }}
          username: ${{ matrix.server.username }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ matrix.server.port }}
          script: |
            set -eu
            cd "${{ matrix.server.gitDownFolder }}/here-news-data/${{ github.run_id }}"
            rm -f articles.js articles.sha256 installed
            cd ..
            rmdir "${{ github.run_id }}"
