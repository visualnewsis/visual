name: VISUAL NEWSIS quality checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate service pages and global header rules
        run: python .github/scripts/check_visual_site.py
      - name: Validate shared header JavaScript syntax
        run: node --check assets/visual-header.js
