    .press-overlay{position:fixed;z-index:50;inset:0;display:grid;place-items:center;padding:20px;background:rgba(9,10,8,.88);opacity:0;visibility:hidden;transition:.35s}.press-overlay.show{opacity:1;visibility:visible}.press-sheet{position:relative;width:min(760px,100%);padding:clamp(30px,6vw,72px);background:#f0e8d4;color:#191815;transform:translateY(-70px) rotate(-1deg);transition:.75s cubic-bezier(.2,.8,.2,1);box-shadow:0 32px 80px #000}.show .press-sheet{transform:translateY(0) rotate(-1deg)}.press-sheet:before{content:"인쇄 완료";position:absolute;right:6%;top:8%;padding:9px;border:3px double var(--red);color:var(--red);font:700 13px var(--serif);transform:rotate(8deg)}.press-sheet small{font-size:9px;letter-spacing:.18em;color:var(--red)}.press-sheet h2{margin:50px 0 28px;font:900 clamp(28px,5vw,56px)/1.35 var(--serif);letter-spacing:-.06em}.press-sheet p{color:#625c50;font:500 14px/1.8 var(--serif)}.article-link{display:flex;justify-content:space-between;margin-top:34px;padding:16px 0;border-top:1px solid var(--ink);font-size:12px;font-weight:800;text-decoration:none}.next{margin-top:18px;border:0;background:none;padding:6px 0;color:#696256;font-size:11px;text-decoration:underline}.wrong{animation:shake .38s ease}.wrong .proof-status b:after{content:" · 재조판"}.flash{position:fixed;z-index:60;inset:0;background:#e8dcc2;pointer-events:none;animation:flash .32s forwards}@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}@keyframes flash{to{opacity:0}}

<body class="theme-printshop">
  <div class="grain" aria-hidden="true"></div>
  <header class="site-header"><a class="brand brand--logo" href="../" aria-label="충무로딩으로 이동"><img src="../assets/chungmuroading-logo-v1.png" alt="충무로딩 — 충무로 보고 듣고 즐기기"></a><a class="newsis-logo" href="http://www.newsis.com" target="_blank" rel="noopener" aria-label="뉴시스 홈페이지 새 창에서 열기"><img src="../../assets/logo2024.png" alt="뉴시스"></a><a class="visual-newsis" href="https://visual.newsis.com/">VISUAL NEWSIS</a></header>
  <main>
    <section class="intro">
      <p class="kicker">제목있음 · SINCE TODAY</p>
      <h1>한 줄을<span>찍습니다.</span></h1>
      <div class="intro-copy"><strong>흩어진 활자를 골라<br>오늘의 헤드라인을 완성하세요.</strong><p>실제 뉴시스 기사 제목으로 조판합니다.<br>완성된 한 줄은 오늘의 기사로 이어집니다.</p></div>
      <span class="coordinate">37.561827°N · 126.991076°E</span>
    </section>
    <section class="workshop" aria-labelledby="work-title">
      <div class="job-head"><p>오늘의 조판 · <span id="round">01 / 03</span></p><span id="category">사회면</span></div>
      <h2 id="work-title" style="position:absolute;width:1px;height:1px;overflow:hidden">헤드라인 조립하기</h2>
      <div class="proof" id="proof">
        <div class="slots" id="slots"><span class="slot-empty">활자를 순서대로 골라주세요.</span></div>
        <div class="proof-status"><span>HEADLINE PROOF</span><b id="status">조판 대기</b></div>
      </div>
      <div class="typecase"><div class="typecase-label"><span>활자함</span><span>TYPE CASE · CLICK TO SET</span></div><div class="pieces" id="pieces"></div></div>
      <div class="controls"><button class="control" id="undo" type="button">한 칸 빼기</button><button class="control" id="reset" type="button">다시 놓기</button><button class="control" id="chooseOther" type="button">다른 기사 고르기</button><button class="control primary" id="print" type="button" disabled>인쇄하기</button></div>
    </section>
  </main>
  <div class="press-overlay" id="result" role="dialog" aria-modal="true" aria-labelledby="printed-title">
    <article class="press-sheet"><small id="resultMeta">NEWSIS · 오늘의 헤드라인</small><h2 id="printed-title"></h2><p id="summary"></p><a class="article-link" id="articleLink" href="https://www.newsis.com/"><span>기사 원문 읽기</span><span>↗</span></a><button class="next" id="next" type="button">다음 조판으로</button></article>
  </div>
  <small class="credit">크리에이티브 디렉터 = 안재현</small>
  <script>
    const jobs=[
      {category:'사회면',chunks:['서울, 간밤 전국서 가장 더운 29도…','8년 만에','\'초열대야\' 가나'],title:'서울, 간밤 전국서 가장 더운 29도…8년 만에 \'초열대야\' 가나',summary:'서울의 밤 최저기온이 29도를 기록했습니다. 2018년 이후 다시 초열대야가 나타날 가능성이 거론됩니다.',url:'https://www.newsis.com/view/NISX20260805_0003737148'},
      {category:'경제면',chunks:["'삼전·닉스' 쏠림 완화에…",'비반도체에도','볕든다'],title:"'삼전·닉스' 쏠림 완화에…비반도체에도 볕든다",summary:'대형 반도체주에 집중됐던 시장의 관심이 제약·바이오와 콘텐츠 등 비반도체 업종으로 번지고 있습니다.',url:'https://www.newsis.com/view/NISX20260805_0003737144'},
      {category:'경제면',chunks:['고령층 10명 중 7명',"'73세까지",'일하고 싶다\''],title:'고령층 10명 중 7명 "73세까지 일하고 싶다"',summary:'고령층 취업자가 처음으로 1000만명을 넘어선 가운데 희망 근로 연령도 역대 가장 높게 나타났습니다.',url:'https://www.newsis.com/view/NISX20260805_0003737146'}
    ];
    let current=0,chosen=[],order=[];
    const $=s=>document.querySelector(s),shuffle=a=>[...a].sort(()=>Math.random()-.5);
    function render(){const job=jobs[current];order=shuffle(job.chunks.map((text,id)=>({text,id})));chosen=[];$('#round').textContent=String(current+1).padStart(2,'0')+' / 03';$('#category').textContent=job.category;$('#status').textContent='조판 대기';$('#proof').classList.remove('wrong');renderSlots();$('#pieces').innerHTML='';order.forEach(item=>{const b=document.createElement('button');b.className='piece';b.type='button';b.textContent=item.text;b.dataset.id=item.id;b.addEventListener('click',()=>pick(item,b));$('#pieces').append(b)});syncButtons()}
    function pick(item,button){chosen.push(item);button.disabled=true;renderSlots();syncButtons()}
    function renderSlots(){const slots=$('#slots');slots.innerHTML='';if(!chosen.length){slots.innerHTML='<span class="slot-empty">활자를 순서대로 골라주세요.</span>';return}chosen.forEach((item,index)=>{const b=document.createElement('button');b.className='set-piece';b.type='button';b.textContent=item.text;b.title='이 활자 빼기';b.addEventListener('click',()=>removeAt(index));slots.append(b)})}
    function removeAt(index){const [item]=chosen.splice(index,1);const source=document.querySelector(`.piece[data-id="${item.id}"]`);if(source)source.disabled=false;renderSlots();syncButtons()}
    function syncButtons(){$('#print').disabled=chosen.length!==jobs[current].chunks.length;$('#undo').disabled=!chosen.length;$('#reset').disabled=!chosen.length}
    function reset(){chosen=[];document.querySelectorAll('.piece').forEach(b=>b.disabled=false);renderSlots();syncButtons();$('#status').textContent='조판 대기'}
    function chooseOther(){current=(current+1+Math.floor(Math.random()*(jobs.length-1)))%jobs.length;render()}
    function print(){const correct=chosen.every((x,i)=>x.text===jobs[current].chunks[i]);if(!correct){$('#status').textContent='배열 불일치';$('#proof').classList.remove('wrong');void $('#proof').offsetWidth;$('#proof').classList.add('wrong');return}document.body.insertAdjacentHTML('beforeend','<i class="flash" aria-hidden="true"></i>');setTimeout(()=>document.querySelector('.flash')?.remove(),400);const job=jobs[current];$('#printed-title').textContent=job.title;$('#summary').textContent=job.summary;$('#articleLink').href=job.url;$('#next').textContent=current===jobs.length-1?'처음부터 다시':'다음 조판으로';$('#result').classList.add('show');$('#next').focus()}
    $('#undo').addEventListener('click',()=>chosen.length&&removeAt(chosen.length-1));$('#reset').addEventListener('click',reset);$('#chooseOther').addEventListener('click',chooseOther);$('#print').addEventListener('click',print);$('#next').addEventListener('click',()=>{$('#result').classList.remove('show');current=(current+1)%jobs.length;render()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#result').classList.contains('show'))$('#result').classList.remove('show')});render();
  </script>
